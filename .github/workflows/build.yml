name: Build MT6768 Kernel for Merlin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies & GCC-10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip python3-dev zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            gcc-10-aarch64-linux-gnu gcc-10-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            pahole kmod

      # (Tuỳ chọn) Patch nếu repo chưa có sẵn fix — BỎ nếu không cần
      - name: Patch kernel source (mmu_notifier + jump_label)
        run: |
          echo "=== Vá jump_label.h (thêm const) ==="
          python3 - <<'PY'
          import re, sys
          p = "arch/arm64/include/asm/jump_label.h"
          s = open(p).read()
          pattern = r'(static\s+__always_inline\s+bool\s+arch_static_branch(?:_jump)?\s*\(\s*struct\s+static_key\s*\*\s*)(key)'
          s2, n = re.subn(pattern, r'\1const \2', s)
          if n == 0:
              print("CẢNH BÁO: Không khớp mẫu jump_label — bỏ qua")
          else:
              open(p, "w").write(s2)
              print(f"Đã vá {n} hàm")
          PY

      - name: Prepare output dir
        run: mkdir -p out

      - name: Configure kernel (Base defconfig + Merlin config)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1) Defconfig gốc
          make O=out ARCH=arm64 defconfig

          # 2) Merge merlin config (dùng -m để không ghi đè nếu trùng)
          if [ -f arch/arm64/configs/vendor/merlin.config ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m \
              out/.config \
              arch/arm64/configs/vendor/merlin.config
          else
            echo "CẢNH BÁO: Không tìm thấy merlin.config — bỏ qua merge"
          fi

          # 3) Chỉ set những symbol CHẮC CHẮN tồn tại
          scripts/config --file out/.config \
            -e CC_OPTIMIZE_FOR_PERFORMANCE \
            -d CC_OPTIMIZE_FOR_SIZE \
            -d DEBUG_INFO \
            -d DEBUG_INFO_DWARF4 \
            -d DEBUG_INFO_DWARF5 \
            -d DEBUG_INFO_BTF \
            -d GCOV_KERNEL \
            -d KASAN \
            -d KCSAN \
            -d DEBUG_KMEMLEAK

          # 4) KHÔNG tắt KPROBES/FUNCTION_TRACER/STACK_TRACER
          #    (chúng bị select bởi driver MTK, tắt sẽ gây conflict)

          # 5) Resolve lại config sau khi patch
          make O=out ARCH=arm64 olddefconfig

          echo "=== KIỂM TRA CONFIG ==="
          grep -E "CONFIG_CC_OPTIMIZE|CONFIG_DEBUG_INFO=|CONFIG_KPROBES|CONFIG_FUNCTION_TRACER" out/.config || true

      - name: Build kernel (Using GCC-10)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "Bắt đầu build kernel..."
          set -o pipefail
          make O=out ARCH=arm64 -j$(nproc) \
            CC=aarch64-linux-gnu-gcc-10 \
            LD=aarch64-linux-gnu-ld \
            AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm \
            OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump \
            STRIP=aarch64-linux-gnu-strip \
            KCFLAGS="-O2 -Wno-error -Wno-incompatible-pointer-types -Wno-strict-prototypes" \
            V=1 \
            2>&1 | tee build.log

      - name: Show errors if build failed
        if: failure()
        run: |
          echo "===== CÁC DÒNG error: ====="
          grep -n -B2 -A5 "error:" build.log | head -120 || echo "(không có error:)"
          echo ""
          echo "===== CÁC DÒNG make[N]: *** ====="
          grep -n -B2 -A5 "make\[[0-9]\]: \*\*\*" build.log | head -80 || true
          echo ""
          echo "===== 200 DÒNG CUỐI build.log ====="
          tail -200 build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: warn
          retention-days: 30