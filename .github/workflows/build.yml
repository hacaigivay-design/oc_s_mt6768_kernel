name: Build MT6768 Kernel for Merlin + FinaSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 1. TẢI KERNEL SOURCE CỦA BẠN VỀ MÁY ẢO GITHUB
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. CÀI ĐẶT MÔI TRƯỜNG
      - name: Install dependencies + Clang 14 + GCC cross
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            pahole kmod libc6-dev-i386 patch \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

          sudo ln -sf /usr/bin/clang-14        /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14       /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14      /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14      /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14   /usr/local/bin/llvm-strip

      # 3. TẢI FINASU TỪ GITHUB VÀ TÍCH HỢP VÀO KERNEL
      - name: Setup FinaSU & Patch Kernel
        run: |
          set -e
          echo "=== 1. Clone FinaSU ==="
          git clone --depth=1 https://github.com/LyraVoid/FinaSU.git FinaSU_Source
          
          echo "=== 2. Copy code FinaSU vào Kernel ==="
          mkdir -p drivers/kernelsu
          cp -r FinaSU_Source/kernel/* drivers/kernelsu/ 2>/dev/null || true
          
          # Thêm vào Makefile của drivers
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi
          
          echo "=== 3. Chạy script setup để patch kernel ==="
          cd drivers/kernelsu
          chmod +x setup.sh 2>/dev/null || true
          export KSU_KERNEL_DIR="$(pwd)/../.."
          # Chạy setup.sh để nó tự động patch fs/exec.c, fs/open.c, v.v...
          ./setup.sh 2>/dev/null || echo "Cảnh báo: setup.sh không chạy được hoàn toàn, kiểm tra lại!"
          cd ../..
          
          echo "=== 4. Kiểm tra kết quả ==="
          if [ -d "drivers/kernelsu" ]; then
            echo "✅ THÀNH CÔNG: Đã copy code FinaSU vào kernel!"
            grep -q "ksu_handle_execve" fs/exec.c && echo "✅ fs/exec.c đã được patch" || echo "⚠️ fs/exec.c CHƯA được patch"
          else
            echo "❌ THẤT BẠI!"
            exit 1
          fi

      # 4. BẬT CONFIG KSU CHO KERNEL
      - name: Enable FinaSU config
        run: |
          CFG=arch/arm64/configs/vendor/merlin.config
          touch "$CFG"
          grep -q '^CONFIG_KSU=y' "$CFG" || echo 'CONFIG_KSU=y' >> "$CFG"
          grep -q '^CONFIG_KSU_DEBUG' "$CFG" || echo 'CONFIG_KSU_DEBUG=n' >> "$CFG"
          grep -q '^CONFIG_KPROBES=y' "$CFG" || echo 'CONFIG_KPROBES=y' >> "$CFG"
          grep -q '^CONFIG_KPROBE_EVENTS=y' "$CFG" || echo 'CONFIG_KPROBE_EVENTS=y' >> "$CFG"
          grep -q '^CONFIG_OVERLAY_FS=y' "$CFG" || echo 'CONFIG_OVERLAY_FS=y' >> "$CFG"

      # 5. CHUẨN BỊ THƯ MỤC BUILD
      - name: Prepare output dir
        run: mkdir -p out

      # 6. CẤU HÌNH KERNEL
      - name: Configure kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          make O=out ARCH=arm64 vendor/mt6768_defconfig
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m out/.config arch/arm64/configs/vendor/merlin.config
          make O=out ARCH=arm64 olddefconfig

          echo "=== KIỂM TRA CONFIG FINASU ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES" out/.config || echo "❌ KHÔNG TÌM THẤY CONFIG KSU"

      # 7. BUILD KERNEL
      - name: Build kernel (Clang 14)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          set -o pipefail
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            2>&1 | tee build.log | tail -300

      # 8. HIỂN THỊ LỖI NẾU CÓ
      - name: Show errors if failed
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -n -B10 -A15 "error:" build.log | head -200 || true
          else
            echo "Lỗi trước khi build!"
          fi

      # 9. UPLOAD ARTIFACTS
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin-finasu
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/mediatek/*.dtb
          retention-days: 30