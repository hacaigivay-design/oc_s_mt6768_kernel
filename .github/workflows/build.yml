name: Build MT6768 Kernel for Merlin (with FinaSU Stable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies + Clang 14 + GCC cross
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            pahole kmod libc6-dev-i386 \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

          sudo ln -sf /usr/bin/clang-14 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/local/bin/llvm-strip

          echo "=== Clang ==="
          clang --version | head -1
          echo "=== GCC cross ==="
          aarch64-linux-gnu-gcc --version | head -1

      - name: Prepare output dir
        run: mkdir -p out

      - name: Setup FinaSU & Apply Compatibility Patches
        run: |
          echo "=== 1. Running FinaSU setup.sh (Using 'main' branch for stability on 4.19) ==="
          # Ép sử dụng nhánh 'main' thay vì 'dev' mặc định để đảm bảo ổn định cho kernel 4.19
          curl -LSs "https://raw.githubusercontent.com/LyraVoid/FinaSU/main/kernel/setup.sh" | bash -s main
          
          echo "=== 2. Fixing MODULE_IMPORT_NS for kernel < 5.10 ==="
          grep -rl "MODULE_IMPORT_NS" --include="*.c" . > /tmp/fix_ns.txt || true
          if [ -s /tmp/fix_ns.txt ]; then
              while IFS= read -r f; do
                  sed -i '/MODULE_IMPORT_NS/d' "$f"
              done < /tmp/fix_ns.txt
              echo "[+] Removed MODULE_IMPORT_NS declarations."
          fi

          echo "=== 3. Fixing blk-crypto inline errors (Kernel 4.19 compatibility) ==="
          if [ -f include/linux/keyslot-manager.h ]; then
              sed -i 's/always_inline inline/inline/g' include/linux/keyslot-manager.h
          fi
          if [ -f include/linux/blk-crypto.h ]; then
              sed -i 's/always_inline inline/inline/g' include/linux/blk-crypto.h
          fi
          echo "[+] Patched crypto headers."

          echo "=== 4. Fixing file_wrapper.c for older kernels ==="
          F=$(find . -name "file_wrapper.c" -path "*/kernelsu/*" | head -1)
          if [ -n "$F" ] && [ -f "$F" ]; then
              perl -0777 -i -pe 's/(\s+)p->ops\.iopoll = fp->f_op->iopoll \? ksu_wrapper_iopoll : NULL;/$1#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)\n$1p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;\n$1#endif/s' "$F"
              perl -0777 -i -pe 's/(\s+)p->ops\.remap_file_range = fp->f_op->remap_file_range \? ksu_wrapper_remap_file_range : NULL;/$1#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 20, 0)\n$1p->ops.remap_file_range = fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;\n$1#endif/s' "$F"
              perl -0777 -i -pe 's/(\s+)return orig->f_op->iopoll\(kiocb, spin\);/$1#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)\n$1return orig->f_op->iopoll(kiocb, spin);\n$1#else\n$1return -EOPNOTSUPP;\n$1#endif/s' "$F"
              echo "[+] Patched file_wrapper.c"
          fi

          echo "=== 5. Fixing seccomp_cache.c for older kernels ==="
          SC=$(find . -name "seccomp_cache.c" -path "*/kernelsu/*" | head -1)
          if [ -n "$SC" ] && [ -f "$SC" ]; then
              # Thêm fallback define nếu kernel thiếu
              sed -i '1i #ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR 4096\n#endif' "$SC"
              echo "[+] Patched seccomp_cache.c"
          fi

          echo "=== 6. Safely disabling supercall.c advanced features for < 5.10 ==="
          SU=$(find . -name "supercall.c" -path "*supercall*" | head -1)
          if [ -n "$SU" ] && [ -f "$SU" ]; then
              # Wrap toàn bộ file bằng #if 0 để tránh lỗi cú pháp task_work_add trên kernel cũ
              # Tính năng này không ảnh hưởng đến root cơ bản
              sed -i '1i #if 0 /* Disabled for kernel < 5.10 compatibility */' "$SU"
              echo '#endif /* Disabled */' >> "$SU"
              echo "[+] Disabled supercall.c advanced features."
          fi

          echo "=== 7. Applying manual kprobe hooks to fs/ ==="
          # Patch fs/exec.c
          cat << 'EOF' > exec.patch
          --- a/fs/exec.c
          +++ b/fs/exec.c
          @@ -1890,11 +1890,14 @@ static int __do_execve_file(int fd, struct filename *filename,
           	return retval;
           }
           
          +extern bool ksu_execveat_hook __read_mostly;
          +extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
          +			void *envp, int *flags);
          +extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
          +				 void *argv, void *envp, int *flags);
           static int do_execveat_common(int fd, struct filename *filename,
           			      struct user_arg_ptr argv,
           			      struct user_arg_ptr envp,
           			      int flags)
           {
          +	if (unlikely(ksu_execveat_hook))
          +		ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          +	else
          +		ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
           	return __do_execve_file(fd, filename, argv, envp, flags, NULL);
           }
          EOF
          patch -p1 < exec.patch || echo "[INFO] exec.c patch skipped"

          # Patch fs/open.c
          cat << 'EOF' > open.patch
          --- a/fs/open.c
          +++ b/fs/open.c
          @@ -348,6 +348,8 @@ SYSCALL_DEFINE4(fallocate, int, fd, int, mode, loff_t, offset, loff_t, len)
           	return ksys_fallocate(fd, mode, offset, len);
           }
           
          +extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
           long do_faccessat(int dfd, const char __user *filename, int mode)
           {
          +	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
           	const struct cred *old_cred;
          EOF
          patch -p1 < open.patch || echo "[INFO] open.c patch skipped"

          # Patch fs/read_write.c
          cat << 'EOF' > read_write.patch
          --- a/fs/read_write.c
          +++ b/fs/read_write.c
          @@ -434,10 +434,14 @@ ssize_t kernel_read(struct file *file, void *buf, size_t count, loff_t *pos)
           }
           EXPORT_SYMBOL(kernel_read);
           
          +extern bool ksu_vfs_read_hook __read_mostly;
          +extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);
           ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)
           {
           	ssize_t ret;
          +	if (unlikely(ksu_vfs_read_hook))
          +		ksu_handle_vfs_read(&file, &buf, &count, &pos);
           	if (!(file->f_mode & FMODE_READ))
           		return -EBADF;
          EOF
          patch -p1 < read_write.patch || echo "[INFO] read_write.c patch skipped"

          # Patch fs/stat.c
          cat << 'EOF' > stat.patch
          --- a/fs/stat.c
          +++ b/fs/stat.c
          @@ -148,6 +148,8 @@ int vfs_statx_fd(unsigned int fd, struct kstat *stat,
           }
           EXPORT_SYMBOL(vfs_statx_fd);
           
          +extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
           int vfs_statx(int dfd, const char __user *filename, int flags, struct kstat *stat, u32 request_mask)
           {
          +	ksu_handle_stat(&dfd, &filename, &flags);
           	int error = -EINVAL;
          EOF
          patch -p1 < stat.patch || echo "[INFO] stat.c patch skipped"

      - name: Configure kernel with FinaSU & Kprobes
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          make O=out ARCH=arm64 vendor/mt6768_defconfig

          echo "=== Injecting FinaSU & Kprobe configs ==="
          cat << 'EOF' >> arch/arm64/configs/vendor/merlin.config
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          CONFIG_MODULE_FORCE_LOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y
          CONFIG_BLK_INLINE_ENCRYPTION=n
          CONFIG_FS_ENCRYPTION=n
          CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y
          CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="mediatek/mt6768"
          EOF

          echo "=== Merge merlin.config ==="
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m \
            out/.config \
            arch/arm64/configs/vendor/merlin.config

          make O=out ARCH=arm64 olddefconfig

          echo "=== VERIFY CONFIG ==="
          grep -E "CONFIG_KSU=y|CONFIG_KPROBES=y" out/.config || echo "WARNING: Config missing!"

      - name: Build kernel (Clang 14)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== Clang dang dung ==="
          clang --version | head -1

          # QUAN TRỌNG: Bắt lỗi ngay lập tức nếu make fail
          set -eo pipefail
          
          echo "Starting kernel build with FinaSU..."
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz-dtb 2>&1 | tee build.log
          
          echo "=== KIEM TRA OUTPUT ==="
          ls -lh out/arch/arm64/boot/ | grep -E "Image|dtb" || true

      - name: Show errors if failed
        if: failure()
        run: |
          echo "======== BUILD FAILED - CHECK ERRORS ========"
          if [ -f build.log ]; then
            echo "======== error: DAU TIEN ========"
            grep -n -B10 -A15 "error:" build.log | head -200 || echo "(khong co error:)"
            echo ""
            echo "======== 150 dong cuoi ========"
            tail -150 build.log || true
          else
            echo "build.log KHONG TON TAI"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin-finasu
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: error
          retention-days: 30