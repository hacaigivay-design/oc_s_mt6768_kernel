name: Build MT6768 Kernel for Merlin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies & GCC-10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip python3-dev zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            gcc-10-aarch64-linux-gnu gcc-10-arm-linux-gnueabi binutils-aarch64-linux-gnu

      - name: Patch kernel source (Fix mmu_notifier error)
        run: |
          python3 -c "
import os
file_path = 'include/linux/mmu_notifier.h'
if os.path.exists(file_path):
    with open(file_path, 'r') as f:
        lines = f.readlines()
    new_lines = []
    for line in lines:
        if 'static inline void mmu_notifier_range_init' in line:
            new_lines.append('enum mmu_notifier_event { MMU_NOTIFY_UNMAP = 0, MMU_NOTIFY_CLEAR, MMU_NOTIFY_PROTECTION_VMA, MMU_NOTIFY_PROTECTION_PAGE, MMU_NOTIFY_SOFT_DIRTY, MMU_NOTIFY_RELEASE, MMU_NOTIFY_MIGRATE };\n')
        new_lines.append(line)
    with open(file_path, 'w') as f:
        f.writelines(new_lines)
    print('Đã vá file mmu_notifier.h thành công!')
else:
    print('Không tìm thấy file mmu_notifier.h')
"

      - name: Prepare output dir
        run: mkdir -p out

      - name: Configure kernel (Base defconfig + Merlin config)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          echo "Bước 1: Tạo base config..."
          make O=out ARCH=arm64 defconfig
          
          echo "Bước 2: Gộp cấu hình merlin.config..."
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out \
            out/.config \
            arch/arm64/configs/vendor/merlin.config
          
          echo "Bước 3: Ép bật các CONFIG bắt buộc (Fix xung đột)..."
          echo "CONFIG_MMU_NOTIFIER=y" >> out/.config
          echo "CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES=\"mediatek/merlin\"" >> out/.config
          echo "CONFIG_ARCH_MTK_PROJECT=\"merlin\"" >> out/.config
          
          echo "Bước 4: Đồng bộ lại config..."
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel (Using GCC-10)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          echo "Bắt đầu build kernel bằng GCC-10..."
          make O=out ARCH=arm64 -j$(nproc) \
            CC=aarch64-linux-gnu-gcc-10 \
            LD=aarch64-linux-gnu-ld \
            AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm \
            OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump \
            STRIP=aarch64-linux-gnu-strip \
            KCFLAGS="-Wno-error -Wno-incompatible-pointer-types -Wno-strict-prototypes" \
            KBUILD_CFLAGS="-Wno-error -Wno-incompatible-pointer-types -Wno-strict-prototypes"

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb.img
          if-no-files-found: warn
          retention-days: 30
