name: Build MT6768 Kernel for Merlin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------------
      # 1) Cài dependencies + toolchain GCC-10
      #    - gcc-10-aarch64-linux-gnu   → binary aarch64-linux-gnu-gcc-10
      #    - gcc-aarch64-linux-gnu      → symlink aarch64-linux-gnu-gcc
      #    (bắt buộc có symlink vì kernel Makefile tự gọi tên không số)
      # ------------------------------------------------------------------
      - name: Install build dependencies & toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip python3-dev zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            gcc-10-aarch64-linux-gnu g++-10-aarch64-linux-gnu \
            gcc-10-arm-linux-gnueabi  g++-10-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            pahole kmod libc6-dev-i386

      # ------------------------------------------------------------------
      # 2) Ép symlink aarch64-linux-gnu-gcc → bản gcc-10 (kernel 4.19 MTK)
      #    (nếu bước cài đã tạo symlink trỏ gcc-11/12, ghi đè để chắc chắn)
      # ------------------------------------------------------------------
      - name: Force toolchain to GCC-10
        run: |
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-10 /usr/local/bin/aarch64-linux-gnu-gcc
          sudo ln -sf /usr/bin/aarch64-linux-gnu-g++-10 /usr/local/bin/aarch64-linux-gnu-g++
          sudo ln -sf /usr/bin/arm-linux-gnueabi-gcc-10 /usr/local/bin/arm-linux-gnueabi-gcc
          sudo ln -sf /usr/bin/arm-linux-gnueabi-g++-10 /usr/local/bin/arm-linux-gnueabi-g++
          echo "=== Toolchain check ==="
          aarch64-linux-gnu-gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1

      - name: Prepare output dir
        run: mkdir -p out

      # ------------------------------------------------------------------
      # 3) Configure kernel
      #    - Export CC/LD/... ngay từ defconfig (đây là chỗ trước đây fail)
      #    - Không tắt KPROBES / FUNCTION_TRACER / STACK_TRACER
      #    - Không echo CONFIG_MMU_NOTIFIER=y (symbol không tồn tại)
      # ------------------------------------------------------------------
      - name: Configure kernel (defconfig + merlin config)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=aarch64-linux-gnu-gcc-10
          export LD=aarch64-linux-gnu-ld
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip

          # 3.1) Defconfig gốc
          make O=out ARCH=arm64 defconfig

          # 3.2) Merge merlin.config (nếu có)
          if [ -f arch/arm64/configs/vendor/merlin.config ]; then
            echo "=== Merge merlin.config ==="
            ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m \
              out/.config \
              arch/arm64/configs/vendor/merlin.config
          else
            echo "CẢNH BÁO: Không tìm thấy arch/arm64/configs/vendor/merlin.config"
          fi

          # 3.3) Tối ưu hóa: ép -O2, tắt debug nặng
          scripts/config --file out/.config \
            -e CC_OPTIMIZE_FOR_PERFORMANCE \
            -d CC_OPTIMIZE_FOR_SIZE \
            -d DEBUG_INFO \
            -d DEBUG_INFO_DWARF4 \
            -d DEBUG_INFO_DWARF5 \
            -d DEBUG_INFO_BTF \
            -d GCOV_KERNEL \
            -d KASAN \
            -d KCSAN \
            -d DEBUG_KMEMLEAK

          # 3.4) Resolve lại config
          make O=out ARCH=arm64 olddefconfig

          echo "=== KIỂM TRA CONFIG ==="
          grep -E "CONFIG_CC_OPTIMIZE|CONFIG_DEBUG_INFO=|CONFIG_KPROBES|CONFIG_FUNCTION_TRACER" out/.config || true

      # ------------------------------------------------------------------
      # 4) Build
      # ------------------------------------------------------------------
      - name: Build kernel (GCC-10)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "Bắt đầu build kernel..."
          set -o pipefail
          make O=out ARCH=arm64 -j$(nproc) \
            CC=aarch64-linux-gnu-gcc-10 \
            LD=aarch64-linux-gnu-ld \
            AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm \
            OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump \
            STRIP=aarch64-linux-gnu-strip \
            KCFLAGS="-O2 -Wno-error -Wno-incompatible-pointer-types -Wno-strict-prototypes" \
            V=1 \
            2>&1 | tee build.log

      - name: Show errors if build failed
        if: failure()
        run: |
          echo "===== CÁC DÒNG error: (kèm ngữ cảnh) ====="
          grep -n -B3 -A8 "error:" build.log | head -200 || echo "(không có error:)"
          echo ""
          echo "===== CÁC DÒNG make[N]: *** ====="
          grep -n -B3 -A5 "make\[[0-9]\]: \*\*\*" build.log | head -100 || true
          echo ""
          echo "===== 200 DÒNG CUỐI build.log ====="
          tail -200 build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: warn
          retention-days: 30