name: Build MT6768 Kernel for Merlin (FinaSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrate FinaSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/LyraVoid/FinaSU/master/kernel/setup.sh" | bash -s legacy || \
          curl -LSs "https://raw.githubusercontent.com/LyraVoid/FinaSU/master/kernel/setup.sh" | bash
          ls -la KernelSU/ 2>/dev/null || ls -la drivers/kernelsu/ 2>/dev/null || true

      - name: Patch FinaSU for kernel 4.19
        run: |
          set -e

          if [ -f drivers/kernelsu/core/init.c ]; then
            sed -i 's|^MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);|/* removed for 4.19 */|' drivers/kernelsu/core/init.c || true
          fi

          if [ -f fs/dcache.c ]; then
            grep -q "linux/susfs.h" fs/dcache.c || sed -i '/#include <linux\/dcache.h>/a #ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs.h>\n#endif' fs/dcache.c || true
          fi

          if [ -f include/linux/fs.h ] && ! grep -q "INODE_STATE_SUS_PATH" include/linux/fs.h; then
            sed -i '/^#endif \/\* _LINUX_FS_H \*\//i #ifdef CONFIG_KSU_SUSFS\n#ifndef INODE_STATE_SUS_PATH\n#define INODE_STATE_SUS_PATH (1 << 16)\n#endif\n#endif' include/linux/fs.h || true
          fi

          if [ -f include/linux/sched.h ] && ! grep -q "TASK_STRUCT_NON_ROOT_USER_APP_PROC" include/linux/sched.h; then
            sed -i '/^#endif \/\* _LINUX_SCHED_H \*\//i #ifdef CONFIG_KSU_SUSFS\n#ifndef TASK_STRUCT_NON_ROOT_USER_APP_PROC\n#define TASK_STRUCT_NON_ROOT_USER_APP_PROC (1 << 0)\n#endif\n#endif' include/linux/sched.h || true
          fi

      - name: Patch file_wrapper.c for kernel 4.19
        run: |
          set -e
          F=$(find . -name "file_wrapper.c" | head -1)
          if [ -z "$F" ]; then
            echo "KHONG TIM THAY file_wrapper.c"
            exit 1
          fi
          echo "Patching: $F"

          cat > /tmp/patch_fw.py << 'PYEOF'
          import sys, re

          path = sys.argv[1]
          with open(path, 'r', errors='ignore') as f:
              lines = f.readlines()

          out = []
          i = 0
          while i < len(lines):
              line = lines[i]

              # 1. iopoll (kernel >= 5.1)
              if 'orig->f_op->iopoll' in line and 'return' in line:
                  out.append('#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)\n')
                  out.append(line)
                  out.append('#else\n')
                  out.append('    return -EOPNOTSUPP;\n')
                  out.append('#endif\n')
                  i += 1
                  continue

              # 2. p->ops.iopoll assignment (kernel >= 5.1)
              if 'p->ops.iopoll' in line and 'fp->f_op->iopoll' in line:
                  out.append('#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)\n')
                  out.append(line)
                  out.append('#endif\n')
                  i += 1
                  continue

              # 3. Block remap_file_range / REMAP_FILE_DEDUP: boc ca cum if..else
              if 'REMAP_FILE_DEDUP' in line:
                  # Tim den khi het block else {...}
                  block = [line]
                  depth = line.count('{') - line.count('}')
                  j = i + 1
                  while j < len(lines) and depth > 0:
                      block.append(lines[j])
                      depth += lines[j].count('{') - lines[j].count('}')
                      j += 1
                  # Them phan else neu co
                  if j < len(lines) and 'else' in lines[j]:
                      block.append(lines[j])
                      depth = lines[j].count('{') - lines[j].count('}')
                      j += 1
                      while j < len(lines) and depth > 0:
                          block.append(lines[j])
                          depth += lines[j].count('{') - lines[j].count('}')
                          j += 1
                  out.append('#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 20, 0)\n')
                  out.extend(block)
                  out.append('#else\n')
                  out.append('    return -EOPNOTSUPP;\n')
                  out.append('#endif\n')
                  i = j
                  continue

              # 4. p->ops.remap_file_range assignment (kernel >= 4.20)
              if 'p->ops.remap_file_range' in line:
                  out.append('#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 20, 0)\n')
                  out.append(line)
                  out.append('#endif\n')
                  i += 1
                  continue

              out.append(line)
              i += 1

          with open(path, 'w') as f:
              f.writelines(out)
          print("PATCHED OK")
          PYEOF

          python3 /tmp/patch_fw.py "$F"

          echo "=== Verify ==="
          grep -n "iopoll\|remap_file_range\|REMAP_FILE_DEDUP" "$F" || true

      - name: Install dependencies + Clang 14 + GCC cross
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            pahole kmod libc6-dev-i386 \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

          sudo ln -sf /usr/bin/clang-14 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/local/bin/llvm-strip

          clang --version | head -1
          aarch64-linux-gnu-gcc --version | head -1

      - name: Prepare output dir
        run: mkdir -p out

      - name: Configure kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          make O=out ARCH=arm64 vendor/mt6768_defconfig

          ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m \
            out/.config \
            arch/arm64/configs/vendor/merlin.config

          cat >> out/.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KPROBES=y
          CONFIG_NOMOUNT=y
          EOF

          make O=out ARCH=arm64 olddefconfig
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_KALLSYMS" out/.config || true

      - name: Build kernel (Clang 14)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          clang --version | head -1

          set -o pipefail
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            2>&1 | tee build.log | tail -300

      - name: Show errors if failed
        if: failure()
        run: |
          if [ ! -f build.log ]; then
            echo "build.log KHONG TON TAI"
            exit 0
          fi
          echo "======== error: DAU TIEN ========"
          grep -n -B10 -A15 "error:" build.log | head -200 || echo "(khong co error:)"
          echo ""
          echo "======== 150 dong cuoi ========"
          tail -150 build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: warn
          retention-days: 30
