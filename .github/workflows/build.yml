name: Build MT6768 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: List all defconfigs
        run: |
          echo "=== arch/arm64/configs/ ==="
          ls arch/arm64/configs/ | grep -iE "merlin|mt6768|k68|lineage|vendor" || ls arch/arm64/configs/
          echo ""
          echo "=== arch/arm64/configs/vendor/ ==="
          ls arch/arm64/configs/vendor/ 2>/dev/null || echo "KHONG CO"
          echo ""
          echo "=== Tìm file defconfig chứa 'merlin' ==="
          grep -rl "merlin" arch/arm64/configs/ 2>/dev/null | head -20

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            pahole kmod libc6-dev-i386

      - name: Prepare output dir
        run: mkdir -p out

      # ============================================================
      # CHỈNH DÒNG NÀY sau khi xem output bước "List all defconfigs"
      # Ví dụ: merlin_defconfig / vendor/merlin_defconfig / k6873v1_64_defconfig
      # ============================================================
      - name: Configure kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out ARCH=arm64 merlin_defconfig
          # ↑ ĐỔI tên defconfig cho đúng sau khi xem output bước List

          echo "=== Kiem tra config da sinh ==="
          grep -E "CONFIG_ARCH_MEDIATEK|CONFIG_MTK|CONFIG_KVM=|CONFIG_BPF=|CONFIG_RCU_TASKS_TRACE|CONFIG_NFS_FS" out/.config || true

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          set -o pipefail
          make O=out ARCH=arm64 -j$(nproc) 2>&1 | tee build.log | tail -300

      - name: Show errors if failed
        if: failure()
        run: |
          grep -n -B10 -A15 "error:" build.log | head -200 || echo "(khong co error:)"
          echo ""
          tail -100 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
          retention-days: 30