          # 12. supercall.c - task_work_add cho kernel < 5.10
          SU=$(find . -name "supercall.c" -path "*supercall*" | head -1)
          if [ -n "$SU" ]; then
            grep -q "linux/version.h" "$SU" || sed -i '1i #include <linux/version.h>' "$SU" || true
            perl -0777 -i -pe '
              s{
                if\s*\(task_work_add\(current,\s*&tw->cb,\s*TWA_RESUME\)\)\s*\{
                  kfree\(tw\);
                  pr_warn\("install fd add task_work failed\\n"\);
                \}
              }{
                #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)
                    if (task_work_add(current, &tw->cb, TWA_RESUME)) {
                        kfree(tw);
                        pr_warn("install fd add task_work failed");
                    }
                #else
                    /* Kernel 4.19: call directly, we are in process context */
                    ksu_install_fd_tw_func(&tw->cb);
                #endif
              }sx
            ' "$SU" || true
            echo "supercall.c OK"
          fi
