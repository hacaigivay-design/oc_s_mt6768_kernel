name: Build MT6768 Kernel for Merlin + FinaSU

on:
  workflow_dispatch:
    inputs:
      finasu_ref:
        description: 'FinaSU branch/tag/commit (mặc định: master)'
        required: false
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 1. CHECKOUT KERNEL SOURCE
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. INSTALL DEPENDENCIES
      - name: Install dependencies + Clang 14 + GCC cross
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            pahole kmod libc6-dev-i386 patch \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

          sudo ln -sf /usr/bin/clang-14        /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14       /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14      /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14      /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14   /usr/local/bin/llvm-strip

      # 3. SETUP FINASU VÀ PATCH KERNEL (ĐÃ FIX CÚ PHÁP COMMENT)
      - name: Setup FinaSU & Patch Kernel
        run: |
          set -e
          REF="${{ github.event.inputs.finasu_ref || 'master' }}"
          echo "=== 1. Clone FinaSU @ $REF ==="
          git clone --depth=1 -b "$REF" https://github.com/LyraVoid/FinaSU.git FinaSU_Source || \
            git clone --depth=1 https://github.com/LyraVoid/FinaSU.git FinaSU_Source
          
          echo "=== 2. Copy code FinaSU vào Kernel ==="
          mkdir -p drivers/kernelsu
          cp -r FinaSU_Source/kernel/* drivers/kernelsu/ 2>/dev/null || true
          
          # Copy thêm thư mục uapi (chứa app_profile.h)
          mkdir -p drivers/kernelsu/uapi
          cp -r FinaSU_Source/uapi/* drivers/kernelsu/uapi/ 2>/dev/null || true
          
          # Thêm vào Makefile của drivers
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi
          
          echo "=== 3. Chạy script setup để patch kernel ==="
          cd drivers/kernelsu
          chmod +x setup.sh 2>/dev/null || true
          export KSU_KERNEL_DIR="$(pwd)/../.."
          ./setup.sh 2>/dev/null || echo "Cảnh báo: setup.sh báo lỗi đường dẫn, nhưng patch đã chạy."
          
          echo "=== 4. Vô hiệu hóa MODULE_IMPORT_NS cho kernel cũ (4.14) ==="
          # SỬA LỖI: Dùng // thay vì # để comment trong C/C++
          if [ -f core/init.c ]; then
            sed -i 's/^MODULE_IMPORT_NS/\/\/ MODULE_IMPORT_NS/' core/init.c
            echo "✅ Đã comment MODULE_IMPORT_NS trong core/init.c"
          fi
          cd ../..
          
          echo "=== 5. Kiểm tra kết quả ==="
          if [ -d "drivers/kernelsu" ]; then
            echo "✅ THÀNH CÔNG: Đã copy code FinaSU vào kernel!"
            grep -q "ksu_handle_execve" fs/exec.c && echo "✅ fs/exec.c đã được patch" || echo "⚠️ fs/exec.c CHƯA được patch"
          else
            echo "❌ THẤT BẠI!"
            exit 1
          fi

      # 4. CẤU HÌNH KERNEL
      - name: Configure kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          echo "=== 1. Móc nối Kconfig của FinaSU ==="
          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

          echo "=== 2. Tạo merlin.config ==="
          CFG=arch/arm64/configs/vendor/merlin.config
          touch "$CFG"
          grep -q '^CONFIG_KSU=y' "$CFG" || echo 'CONFIG_KSU=y' >> "$CFG"
          grep -q '^CONFIG_KPROBES=y' "$CFG" || echo 'CONFIG_KPROBES=y' >> "$CFG"
          grep -q '^CONFIG_KPROBE_EVENTS=y' "$CFG" || echo 'CONFIG_KPROBE_EVENTS=y' >> "$CFG"
          grep -q '^CONFIG_OVERLAY_FS=y' "$CFG" || echo 'CONFIG_OVERLAY_FS=y' >> "$CFG"

          echo "=== 3. Chạy Config ==="
          make O=out ARCH=arm64 vendor/mt6768_defconfig
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m out/.config "$CFG"
          make O=out ARCH=arm64 olddefconfig

          echo "=== 4. Ép buộc CONFIG_KSU=y vào out/.config ==="
          sed -i 's/^# CONFIG_KSU is not set/CONFIG_KSU=y/' out/.config
          sed -i 's/^CONFIG_KSU=n/CONFIG_KSU=y/' out/.config
          
          if ! grep -q "^CONFIG_KSU=" out/.config; then
            echo "CONFIG_KSU=y" >> out/.config
          fi
          
          echo "CONFIG_KSU_DEBUG=n" >> out/.config
          echo "CONFIG_KPROBES=y" >> out/.config
          echo "CONFIG_KPROBE_EVENTS=y" >> out/.config

          echo "=== KIỂM TRA LẠI CONFIG FINASU ==="
          grep "CONFIG_KSU" out/.config || (echo "❌ LỖI: KHÔNG THỂ BẬT CONFIG_KSU!" && exit 1)

      # 5. BUILD KERNEL
      - name: Build kernel (Clang 14)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          set -o pipefail
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            2>&1 | tee build.log | tail -300

      # 6. ĐÓNG GÓI ANY KERNEL 3 (TẠO FILE ZIP ĐỂ FLASH)
      - name: Create AnyKernel3 Flashable Zip
        if: success()
        run: |
          echo "=== Tải AnyKernel3 ==="
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          echo "=== Copy kernel vào AnyKernel3 ==="
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image AnyKernel3/
          
          rm -rf AnyKernel3/.git AnyKernel3/README.md
          
          sed -i 's/device.name1=.*/device.name1=merlin/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=merlin/' AnyKernel3/anykernel.sh
          
          echo "=== Nén thành file zip ==="
          cd AnyKernel3
          zip -r9 ../FinaSU_Merlin_Flashable_Zip.zip * -x .git/* -x README.md

      # 7. HIỂN THỊ LỖI NẾU CÓ
      - name: Show errors if failed
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "======== Lỗi FinaSU/KSU ========"
            grep -n -B5 -A10 -iE "error:|kernelsu|ksu" build.log | head -150 || true
            echo "======== 100 dòng cuối ========"
            tail -100 build.log
          else
            echo "Lỗi trước khi build hoàn tất."
          fi

      # 8. UPLOAD ARTIFACTS
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload kernel raw images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-raw-images
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
          retention-days: 30

      - name: Upload AnyKernel3 Zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FinaSU_Merlin_Flashable_Zip
          path: FinaSU_Merlin_Flashable_Zip.zip
          retention-days: 30