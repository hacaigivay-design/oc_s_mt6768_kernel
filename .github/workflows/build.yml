name: Build MT6768 Kernel

on:
  workflow_dispatch:   # cho phép bấm chạy tay từ tab Actions

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync

      - name: Download Clang Toolchain
        run: |
          mkdir -p $HOME/toolchain/clang
          cd $HOME/toolchain/clang
          # Dùng Clang r416183b ổn định cho kernel 4.19
          wget -q https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/archive/refs/heads/lineage-19.1.tar.gz
          tar -xzf lineage-19.1.tar.gz
          # Di chuyển thư mục clang ra ngoài cho gọn
          mv android_prebuilts_clang_kernel_linux-x86_clang-r416183b-lineage-19.1/* ./
          rm -rf android_prebuilts_clang_kernel_linux-x86_clang-r416183b-lineage-19.1*
          echo "$HOME/toolchain/clang/bin" >> $GITHUB_PATH

      - name: Prepare output dir
        run: mkdir -p out

      - name: Configure kernel (defconfig)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          # LƯU Ý: Thay <TEN_DEFCONFIG> bằng tên defconfig máy bạn (vd: mt6768, ginkgo...)
          make O=out ARCH=arm64 <TEN_DEFCONFIG>_defconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-mt6768
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb.img
          if-no-files-found: warn
          retention-days: 30
