name: Build MT6768 Kernel for Merlin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies & GCC-10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip python3-dev zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            gcc-10-aarch64-linux-gnu gcc-10-arm-linux-gnueabi binutils-aarch64-linux-gnu

      - name: Patch kernel source (mmu_notifier + jump_label)
        run: |
          echo "=== Vá lỗi mmu_notifier ==="
          sed -i '/static inline void mmu_notifier_range_init/i enum mmu_notifier_event { MMU_NOTIFY_UNMAP = 0, MMU_NOTIFY_CLEAR, MMU_NOTIFY_PROTECTION_VMA, MMU_NOTIFY_PROTECTION_PAGE, MMU_NOTIFY_SOFT_DIRTY, MMU_NOTIFY_RELEASE, MMU_NOTIFY_MIGRATE };' include/linux/mmu_notifier.h

          echo "=== Vá jump_label.h (thêm const) ==="
          python3 - <<'PY'
          import re, sys
          p = "arch/arm64/include/asm/jump_label.h"
          s = open(p).read()
          pattern = r'(static\s+__always_inline\s+bool\s+arch_static_branch(?:_jump)?\s*\(\s*struct\s+static_key\s*\*\s*)(key)'
          s2, n = re.subn(pattern, r'\1const \2', s)
          if n == 0:
              print("CẢNH BÁO: Không khớp mẫu!")
              print(s[:2000]); sys.exit(1)
          open(p, "w").write(s2)
          print(f"Đã vá {n} hàm")
          PY
          grep -n "arch_static_branch" arch/arm64/include/asm/jump_label.h

      - name: Prepare output dir
        run: mkdir -p out

      - name: Configure kernel (Base defconfig + Merlin config)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ARCH=arm64 defconfig
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out \
            out/.config \
            arch/arm64/configs/vendor/merlin.config

          echo "CONFIG_MMU_NOTIFIER=y" >> out/.config
          echo "CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES=\"mediatek/merlin\"" >> out/.config
          echo "CONFIG_ARCH_MTK_PROJECT=\"merlin\"" >> out/.config

          echo "=== Ép -O2 và tắt mọi thứ kéo -O0 ==="
          scripts/config --file out/.config -e CC_OPTIMIZE_FOR_PERFORMANCE
          scripts/config --file out/.config -d CC_OPTIMIZE_FOR_SIZE
          scripts/config --file out/.config -d DEBUG_INFO
          scripts/config --file out/.config -d DEBUG_INFO_DWARF4
          scripts/config --file out/.config -d DEBUG_INFO_DWARF5
          scripts/config --file out/.config -d DEBUG_INFO_BTF
          scripts/config --file out/.config -d GCOV_KERNEL
          scripts/config --file out/.config -d KASAN
          scripts/config --file out/.config -d KCSAN
          scripts/config --file out/.config -d DEBUG_KMEMLEAK
          scripts/config --file out/.config -d FUNCTION_TRACER
          scripts/config --file out/.config -d STACK_TRACER
          scripts/config --file out/.config -d KPROBES

          make O=out ARCH=arm64 olddefconfig

          echo "=== KIỂM TRA CONFIG TỐI ƯU HÓA ==="
          grep -E "CONFIG_CC_OPTIMIZE|CONFIG_DEBUG_INFO=" out/.config || true

      - name: Build kernel (Using GCC-10)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "Bắt đầu build kernel..."
          set -o pipefail
          make O=out ARCH=arm64 -j$(nproc) \
            CC=aarch64-linux-gnu-gcc-10 \
            LD=aarch64-linux-gnu-ld \
            AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm \
            OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump \
            STRIP=aarch64-linux-gnu-strip \
            KCFLAGS="-O2 -Wno-error -Wno-incompatible-pointer-types -Wno-strict-prototypes" \
            2>&1 | tee build.log

      - name: Show errors if build failed
        if: failure()
        run: |
          echo "===== CÁC DÒNG error: ====="
          grep -n "error:" build.log | head -50 || echo "(không có error:)"
          echo ""
          echo "===== CÁC DÒNG make[2] *** ====="
          grep -n "make\[2\]: \*\*\*" build.log | head -20 || true
          echo ""
          echo "===== 150 DÒNG CUỐI build.log ====="
          tail -150 build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb.img
          if-no-files-found: warn
          retention-days: 30