name: Build MT6768 Kernel for Merlin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            pahole kmod libc6-dev-i386

      # ------------------------------------------------------------------
      # Tai AOSP prebuilt GCC 9 (giong nguoi khac dung)
      # ------------------------------------------------------------------
      - name: Download AOSP GCC 9 toolchains
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain

          echo "=== Tai GCC 9 aarch64 ==="
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-arm64 || \
            echo "Clone aarch64 GCC that bai"

          echo "=== Tai GCC 4.9 arm (32-bit) ==="
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc-arm || \
            echo "Clone arm GCC that bai"

          echo "=== Kiem tra ==="
          ls -la $HOME/toolchain/
          $HOME/toolchain/gcc-arm64/bin/aarch64-linux-android-gcc --version 2>&1 | head -1 || true
          $HOME/toolchain/gcc-arm/bin/arm-linux-androideabi-gcc --version 2>&1 | head -1 || true

      - name: Prepare output dir
        run: mkdir -p out

      - name: Configure kernel (mt6768_defconfig + merlin.config)
        run: |
          export PATH="$HOME/toolchain/gcc-arm64/bin:$HOME/toolchain/gcc-arm/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          echo "=== Compiler ==="
          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version | head -1

          make O=out ARCH=arm64 vendor/mt6768_defconfig

          echo "=== Merge merlin.config ==="
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m \
            out/.config \
            arch/arm64/configs/vendor/merlin.config

          make O=out ARCH=arm64 olddefconfig

          echo "=== KIEM TRA CONFIG ==="
          grep -E "CONFIG_BLK_INLINE_ENCRYPTION|CONFIG_ARCH_MEDIATEK|CONFIG_CC_OPTIMIZE" out/.config || true

      - name: Build kernel
        run: |
          export PATH="$HOME/toolchain/gcc-arm64/bin:$HOME/toolchain/gcc-arm/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          echo "=== Compiler dang dung ==="
          aarch64-linux-android-gcc --version | head -1

          set -o pipefail
          make O=out ARCH=arm64 -j$(nproc) 2>&1 | tee build.log | tail -300

      - name: Show errors if failed
        if: failure()
        run: |
          echo "======== error: DAU TIEN ========"
          grep -n -B10 -A15 "error:" build.log | head -200 || echo "(khong co error:)"
          echo ""
          echo "======== Error 1/2 ========"
          grep -n -B5 -A5 "Error [12]" build.log | head -100 || true
          echo ""
          echo "======== 150 dong cuoi ========"
          tail -150 build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: warn
          retention-days: 30