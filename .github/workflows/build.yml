name: Build MT6768 Kernel for Merlin (with FinaSU Non-GKI)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies + Clang 14 + GCC cross
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            pahole kmod libc6-dev-i386 \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

          sudo ln -sf /usr/bin/clang-14 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/local/bin/llvm-strip

          echo "=== Clang ==="
          clang --version | head -1
          echo "=== GCC cross ==="
          aarch64-linux-gnu-gcc --version | head -1

      - name: Prepare output dir
        run: mkdir -p out

      - name: Setup FinaSU & Apply Fixes/Patches
        run: |
          echo "=== 1. Running FinaSU setup.sh ==="
          curl -LSs "https://raw.githubusercontent.com/LyraVoid/FinaSU/master/kernel/setup.sh" | bash

          echo "=== 2. Fixing MODULE_IMPORT_NS (Bulletproof - grep based) ==="
          echo "[+] Searching for MODULE_IMPORT_NS in all .c files..."
          grep -rl "MODULE_IMPORT_NS" --include="*.c" . > /tmp/files_to_fix.txt || true
          
          if [ -s /tmp/files_to_fix.txt ]; then
              echo "[+] Found files containing MODULE_IMPORT_NS:"
              cat /tmp/files_to_fix.txt
              echo "[+] Removing MODULE_IMPORT_NS lines from these files..."
              while IFS= read -r f; do
                  sed -i '/MODULE_IMPORT_NS/d' "$f"
                  echo "    - Fixed: $f"
              done < /tmp/files_to_fix.txt
          else
              echo "[!] No files containing MODULE_IMPORT_NS found."
          fi
          
          echo ""
          echo "[+] Verifying fix (should be empty):"
          grep -rn "MODULE_IMPORT_NS" --include="*.c" . || echo "[+] SUCCESS: No MODULE_IMPORT_NS remaining!"

          echo ""
          echo "=== 3. Disabling enable_sucompat() in FinaSU ==="
          grep -rl "enable_sucompat();" --include="*.c" . > /tmp/ksu_files.txt || true
          if [ -s /tmp/ksu_files.txt ]; then
              while IFS= read -r f; do
                  sed -i 's/enable_sucompat();/\/\/ enable_sucompat();/' "$f"
                  echo "    - Disabled in: $f"
              done < /tmp/ksu_files.txt
          fi

          echo ""
          echo "=== 4. Fixing file_wrapper.c for older kernels (Complete fix) ==="
          FILE_WRAPPER=$(find . -name "file_wrapper.c" -path "*/kernelsu/*" 2>/dev/null | head -1)
          if [ -z "$FILE_WRAPPER" ]; then
              FILE_WRAPPER=$(find . -name "file_wrapper.c" -path "*/FinaSU/*" 2>/dev/null | head -1)
          fi
          
          if [ -n "$FILE_WRAPPER" ] && [ -f "$FILE_WRAPPER" ]; then
              echo "[+] Found file_wrapper.c at: $FILE_WRAPPER"
              
              # Fix thân hàm: thay return statements bằng stub
              sed -i 's|return orig->f_op->iopoll(kiocb, spin);|return -EOPNOTSUPP; /* iopoll stub */|' "$FILE_WRAPPER"
              sed -i 's|if (remap_flags & REMAP_FILE_DEDUP) {|if (0) { /* REMAP_FILE_DEDUP stub */|' "$FILE_WRAPPER"
              sed -i 's|return orig->f_op->remap_file_range(file_in, pos_in, orig, pos_out, len, remap_flags);|return -EOPNOTSUPP; /* remap stub */|' "$FILE_WRAPPER"
              sed -i 's|return orig->f_op->remap_file_range(orig, pos_in, file_out, pos_out, len, remap_flags);|return -EOPNOTSUPP; /* remap stub */|' "$FILE_WRAPPER"
              
              # Fix struct assignment: XÓA HOÀN TOÀN các dòng gán p->ops.iopoll và p->ops.remap_file_range
              sed -i '/p->ops\.iopoll/d' "$FILE_WRAPPER"
              sed -i '/p->ops\.remap_file_range/d' "$FILE_WRAPPER"
              
              echo "[+] Successfully patched file_wrapper.c for kernel 4.14 compatibility"
              echo "[+] Removed all iopoll and remap_file_range references"
          else
              echo "[!] file_wrapper.c not found, skipping"
          fi

          echo ""
          echo "=== 5. Applying manual patches to fs/ (Non-GKI kprobe hooks) ==="
          # Patch fs/exec.c
          cat << 'EOF' > exec.patch
          --- a/fs/exec.c
          +++ b/fs/exec.c
          @@ -1890,11 +1890,14 @@ static int __do_execve_file(int fd, struct filename *filename,
           	return retval;
           }
           
          +extern bool ksu_execveat_hook __read_mostly;
          +extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
          +			void *envp, int *flags);
          +extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
          +				 void *argv, void *envp, int *flags);
           static int do_execveat_common(int fd, struct filename *filename,
           			      struct user_arg_ptr argv,
           			      struct user_arg_ptr envp,
           			      int flags)
           {
          +	if (unlikely(ksu_execveat_hook))
          +		ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          +	else
          +		ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
           	return __do_execve_file(fd, filename, argv, envp, flags, NULL);
           }
          EOF
          patch -p1 < exec.patch || echo "[INFO] exec.c patch skipped or already applied"

          # Patch fs/open.c
          cat << 'EOF' > open.patch
          --- a/fs/open.c
          +++ b/fs/open.c
          @@ -348,6 +348,8 @@ SYSCALL_DEFINE4(fallocate, int, fd, int, mode, loff_t, offset, loff_t, len)
           	return ksys_fallocate(fd, mode, offset, len);
           }
           
          +extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,
          +			 int *flags);
           /*
            * access() needs to use the real uid/gid, not the effective uid/gid.
            * We do this by temporarily clearing all FS-related capabilities and
          @@ -355,6 +357,7 @@ SYSCALL_DEFINE4(fallocate, int, fd, int, mode, loff_t, offset, loff_t, len)
            */
           long do_faccessat(int dfd, const char __user *filename, int mode)
           {
          +	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
           	const struct cred *old_cred;
           	struct cred *override_cred;
           	struct path path;
          EOF
          patch -p1 < open.patch || echo "[INFO] open.c patch skipped or already applied"

          # Patch fs/read_write.c
          cat << 'EOF' > read_write.patch
          --- a/fs/read_write.c
          +++ b/fs/read_write.c
          @@ -434,10 +434,14 @@ ssize_t kernel_read(struct file *file, void *buf, size_t count, loff_t *pos)
           }
           EXPORT_SYMBOL(kernel_read);
           
          +extern bool ksu_vfs_read_hook __read_mostly;
          +extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,
          +			size_t *count_ptr, loff_t **pos);
           ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)
           {
           	ssize_t ret;
           
          +	if (unlikely(ksu_vfs_read_hook))
          +		ksu_handle_vfs_read(&file, &buf, &count, &pos);
          +
           	if (!(file->f_mode & FMODE_READ))
           		return -EBADF;
           	if (!(file->f_mode & FMODE_CAN_READ))
          EOF
          patch -p1 < read_write.patch || echo "[INFO] read_write.c patch skipped or already applied"

          # Patch fs/stat.c
          cat << 'EOF' > stat.patch
          --- a/fs/stat.c
          +++ b/fs/stat.c
          @@ -148,6 +148,8 @@ int vfs_statx_fd(unsigned int fd, struct kstat *stat,
           }
           EXPORT_SYMBOL(vfs_statx_fd);
           
          +extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          +
           /**
            * vfs_statx - Get basic and extra attributes by filename
            * @dfd: A file descriptor representing the base dir for a relative filename
          @@ -170,6 +172,7 @@ int vfs_statx(int dfd, const char __user *filename, int flags,
           	int error = -EINVAL;
           	unsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;
           
          +	ksu_handle_stat(&dfd, &filename, &flags);
           	if ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |
           		       AT_EMPTY_PATH | KSTAT_QUERY_FLAGS)) != 0)
           		return -EINVAL;
          EOF
          patch -p1 < stat.patch || echo "[INFO] stat.c patch skipped or already applied"

          # Backport path_umount to fs/namespace.c
          cat << 'EOF' > namespace.patch
          --- a/fs/namespace.c
          +++ b/fs/namespace.c
          @@ -1739,6 +1739,39 @@ static inline bool may_mandlock(void)
           }
           #endif
           
          +static int can_umount(const struct path *path, int flags)
          +{
          +	struct mount *mnt = real_mount(path->mnt);
          +
          +	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          +		return -EINVAL;
          +	if (!may_mount())
          +		return -EPERM;
          +	if (path->dentry != path->mnt->mnt_root)
          +		return -EINVAL;
          +	if (!check_mnt(mnt))
          +		return -EINVAL;
          +	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          +		return -EINVAL;
          +	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          +		return -EPERM;
          +	return 0;
          +}
          +
          +int path_umount(struct path *path, int flags)
          +{
          +	struct mount *mnt = real_mount(path->mnt);
          +	int ret;
          +
          +	ret = can_umount(path, flags);
          +	if (!ret)
          +		ret = do_umount(mnt, flags);
          +
          +	dput(path->dentry);
          +	mntput_no_expire(mnt);
          +	return ret;
          +}
           /*
            * Now umount can handle mount points as well as block devices.
            * This is important for filesystems which use unnamed block devices.
          EOF
          patch -p1 < namespace.patch || echo "[INFO] namespace.c patch skipped or already applied"

      - name: Configure kernel with FinaSU & Kprobes
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          make O=out ARCH=arm64 vendor/mt6768_defconfig

          echo "=== Injecting FinaSU & Kprobe configs ==="
          cat << 'EOF' >> arch/arm64/configs/vendor/merlin.config
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          CONFIG_MODULE_FORCE_LOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y
          EOF

          echo "=== Merge merlin.config ==="
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m \
            out/.config \
            arch/arm64/configs/vendor/merlin.config

          make O=out ARCH=arm64 olddefconfig

          echo "=== KIEM TRA CONFIG ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODULES" out/.config || true

      - name: Build kernel (Clang 14)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== Clang dang dung ==="
          clang --version | head -1

          set -o pipefail
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            2>&1 | tee build.log | tail -300

      - name: Show errors if failed
        if: failure()
        run: |
          if [ ! -f build.log ]; then
            echo "build.log KHONG TON TAI - build fail truoc buoc Build kernel"
            exit 0
          fi
          echo "======== error: DAU TIEN ========"
          grep -n -B10 -A15 "error:" build.log | head -200 || echo "(khong co error:)"
          echo ""
          echo "======== Error 1/2 ========"
          grep -n -B5 -A5 "Error [12]" build.log | head -100 || true
          echo ""
          echo "======== 150 dong cuoi ========"
          tail -150 build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin-finasu
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: warn
          retention-days: 30
