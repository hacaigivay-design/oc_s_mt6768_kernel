- name: Build kernel (Using GCC-10)
  run: |
    export ARCH=arm64
    export SUBARCH=arm64
    export CROSS_COMPILE=aarch64-linux-gnu-
    export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    echo "Bắt đầu build kernel..."
    make O=out ARCH=arm64 -j$(nproc) \
      CC=aarch64-linux-gnu-gcc-10 \
      LD=aarch64-linux-gnu-ld \
      AR=aarch64-linux-gnu-ar \
      NM=aarch64-linux-gnu-nm \
      OBJCOPY=aarch64-linux-gnu-objcopy \
      OBJDUMP=aarch64-linux-gnu-objdump \
      STRIP=aarch64-linux-gnu-strip \
      KCFLAGS="-O2 \
        -Wno-error \
        -Wno-error=array-bounds \
        -Wno-error=stringop-overflow \
        -Wno-error=stringop-truncation \
        -Wno-error=stringop-overread \
        -Wno-error=designated-init \
        -Wno-error=address-of-packed-member \
        -Wno-error=misleading-indentation \
        -Wno-error=maybe-uninitialized \
        -Wno-error=uninitialized \
        -Wno-error=restrict \
        -Wno-error=incompatible-pointer-types \
        -Wno-error=int-conversion \
        -Wno-error=implicit-function-declaration \
        -Wno-incompatible-pointer-types \
        -Wno-strict-prototypes" \
      2>&1 | tee build.log

- name: Show errors if build failed
  if: failure()
  run: |
    echo "===== CÁC DÒNG ERROR ====="
    grep -n "error:" build.log | head -50 || echo "(không tìm thấy dòng 'error:')"
    echo "===== CÁC DÒNG make[2] *** ====="
    grep -n "make\[2\]: \*\*\*" build.log | head -20 || true
    echo "===== 200 DÒNG CUỐI ====="
    tail -200 build.log