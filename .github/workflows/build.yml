name: Build Kernel with KernelSU Action (FinaSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1

      - name: Build Kernel with KernelSU Action
        uses: xiaoleGun/KernelSU_Action@main
        with:
          # Thông tin repo của bạn
          kernel_source: hacaigivay-design/oc_s_mt6768_kernel
          kernel_branch: oc_4.19
          kernel_config: vendor/mt6768_defconfig
          
          # Dùng nhánh legacy cho kernel 4.19
          ksu_version: legacy
          
          # Compiler
          clang_version: 14
          disable_lto: true
          
          # Chữ ký FinaSU Manager (từ file APK bạn đã cung cấp)
          ksu_expected_size: 0x03e6
          ksu_expected_hash: 79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7
          
          # Đóng gói thành zip (tùy chọn)
          anykernel3: false
          
          # Config bổ sung
          extra_config: |
            CONFIG_KSU=y
            CONFIG_KPROBES=y
            CONFIG_KPROBE_EVENTS=y
            CONFIG_MODULES=y
            CONFIG_MODULE_FORCE_LOAD=y
            CONFIG_MODULE_FORCE_UNLOAD=y
            CONFIG_BLK_INLINE_ENCRYPTION=n

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build-Output
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dts/mediatek/*.dtb
            kernel/AnyKernel3/*.zip
          if-no-files-found: error
          retention-days: 7