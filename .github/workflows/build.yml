name: Build MT6768 Kernel (KernelSU-Next Legacy + FinaSU Manager)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: out/
          key: build-output-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            build-output-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache/
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip git curl wget perl \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            pahole kmod libc6-dev-i386 \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            openssl ccache

          sudo ln -sf /usr/bin/clang-14 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/local/bin/llvm-strip

      - name: Prepare output dir
        run: mkdir -p out

      - name: Setup KernelSU-Next (Legacy Mode)
        run: |
          echo "=== Running KernelSU-Next setup.sh (legacy branch for non-GKI) ==="
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          echo "[+] KernelSU-Next legacy setup completed."

      - name: Apply Bulletproof Compatibility Patches
        run: |
          set +e

          echo "=== 1. Bulletproof fix for blk-crypto inline errors ==="
          if [ -f include/linux/keyslot-manager.h ]; then
              sed -i 's/__always_inline inline void ksm_flock/void ksm_flock/g' include/linux/keyslot-manager.h
              sed -i 's/inline void ksm_flock/void ksm_flock/g' include/linux/keyslot-manager.h
              sed -i 's/__always_inline void ksm_flock/void ksm_flock/g' include/linux/keyslot-manager.h
              echo "[+] Patched keyslot-manager.h"
          fi
          if [ -f include/linux/blk-crypto.h ]; then
              sed -i 's/__always_inline inline void blk_crypto_flock/void blk_crypto_flock/g' include/linux/blk-crypto.h
              sed -i 's/inline void blk_crypto_flock/void blk_crypto_flock/g' include/linux/blk-crypto.h
              sed -i 's/__always_inline void blk_crypto_flock/void blk_crypto_flock/g' include/linux/blk-crypto.h
              echo "[+] Patched blk-crypto.h"
          fi

          echo "=== 2. Neutralizing file_wrapper.c safely ==="
          FILE=$(find . -name "file_wrapper.c" -path "*/kernelsu/*" | head -1)
          if [ -n "$FILE" ] && [ -f "$FILE" ]; then
              perl -i -0777 -pe 's/(int ksu_wrapper_iopoll\s*\([^)]*\)\s*\{).*?(\n\})/$1\n    return -EOPNOTSUPP;\n$2/s' "$FILE"
              perl -i -0777 -pe 's/(loff_t ksu_wrapper_remap_file_range\s*\([^)]*\)\s*\{).*?(\n\})/$1\n    return -EOPNOTSUPP;\n$2/s' "$FILE"
              perl -i -pe 's/^(\s*)p->ops\.iopoll = .*/$1\/\/ p->ops.iopoll disabled/' "$FILE"
              perl -i -pe 's/^(\s*)p->ops\.remap_file_range = .*/$1\/\/ p->ops.remap_file_range disabled/' "$FILE"
              echo "[+] file_wrapper.c safely neutralized."
          fi

          echo "=== 3. Fixing MODULE_IMPORT_NS ==="
          grep -rl "MODULE_IMPORT_NS" --include="*.c" . > /tmp/fix_ns.txt || true
          if [ -s /tmp/fix_ns.txt ]; then
              while IFS= read -r f; do sed -i '/MODULE_IMPORT_NS/d' "$f"; done < /tmp/fix_ns.txt
          fi

          echo "=== 4. Fixing seccomp_cache.c ==="
          SC=$(find . -name "seccomp_cache.c" -path "*/kernelsu/*" | head -1)
          if [ -n "$SC" ] && [ -f "$SC" ]; then
              sed -i '1i #ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR 4096\n#endif' "$SC"
          fi

          echo "=== 5. SAFE -Werror handling (REPLACE, not DELETE) ==="
          # THAY THẾ -Werror bằng -Wno-error (không xóa ký tự, giữ nguyên cấu trúc Makefile)
          if [ -f Makefile ]; then
              sed -i 's/-Werror/-Wno-error/g' Makefile
              echo "[+] Replaced -Werror with -Wno-error in main Makefile"
          fi
          # Áp dụng cho scripts/Makefile.*
          find scripts -name "Makefile*" -exec sed -i 's/-Werror/-Wno-error/g' {} \; 2>/dev/null || true
          echo "[+] Replaced -Werror with -Wno-error in scripts/Makefile"
          
          # Verify: kiểm tra không còn -Werror đơn lẻ (chỉ còn -Wno-error)
          if grep -E "\-Werror[^=]|-Werror$" Makefile 2>/dev/null | grep -v "Wno-error"; then
              echo "[!] WARNING: Some -Werror flags still remain"
          else
              echo "[+] All -Werror flags successfully replaced"
          fi

      - name: Extract FinaSU Manager Signature
        run: |
          echo "=== Extracting FinaSU Manager Signature ==="
          DEFAULT_SIZE="0x033b"
          DEFAULT_HASH="c371061b19d8c7d7d6133c6a9bafe198fa944e50c1b31c9d8daa8d7f1fc2d2d6"
          
          if wget -q https://github.com/LyraVoid/FinaSU/releases/latest/download/FinaSU_Manager.apk -O manager.apk 2>/dev/null; then
              if unzip -q manager.apk META-INF/CERT.RSA 2>/dev/null && [ -f META-INF/CERT.RSA ]; then
                  KSU_SIZE=$(stat -c%s META-INF/CERT.RSA)
                  KSU_HASH=$(openssl dgst -sha256 META-INF/CERT.RSA | awk '{print $2}')
                  echo "$KSU_SIZE" > /tmp/ksu_size
                  echo "$KSU_HASH" > /tmp/ksu_hash
                  echo "[+] Successfully extracted FinaSU Manager signature."
              else
                  echo "$DEFAULT_SIZE" > /tmp/ksu_size
                  echo "$DEFAULT_HASH" > /tmp/ksu_hash
              fi
          else
              echo "$DEFAULT_SIZE" > /tmp/ksu_size
              echo "$DEFAULT_HASH" > /tmp/ksu_hash
          fi

      - name: Configure Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LD=ld.lld

          make O=out ARCH=arm64 vendor/mt6768_defconfig
          
          KSU_SIZE=$(cat /tmp/ksu_size)
          KSU_HASH=$(cat /tmp/ksu_hash)
          KSU_SIZE_HEX=$(printf '%x' "$KSU_SIZE")

          echo "=== Injecting KernelSU-Next Legacy + FinaSU configs ==="
          cat << EOF >> arch/arm64/configs/vendor/merlin.config
          CONFIG_KSU=y
          CONFIG_KSU_KPROBE_HOOKS=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          CONFIG_MODULE_FORCE_LOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y
          CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y
          CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="mediatek/mt6768"
          CONFIG_KSU_EXPECTED_SIZE=0x${KSU_SIZE_HEX}
          CONFIG_KSU_EXPECTED_HASH="${KSU_HASH}"
          EOF

          ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m out/.config arch/arm64/configs/vendor/merlin.config
          make O=out ARCH=arm64 olddefconfig
          
          sed -i 's/CONFIG_BLK_INLINE_ENCRYPTION=y/CONFIG_BLK_INLINE_ENCRYPTION=n/g' out/.config
          sed -i 's/CONFIG_FS_ENCRYPTION=y/CONFIG_FS_ENCRYPTION=n/g' out/.config
          make O=out ARCH=arm64 olddefconfig
          
          echo "=== VERIFY CONFIG ==="
          grep -E "CONFIG_KSU=y|CONFIG_KSU_KPROBE_HOOKS=y|CONFIG_BLK_INLINE_ENCRYPTION=n" out/.config || echo "WARNING: Config issue!"

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          # === ENABLE CCACHE ===
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ccache -z
          ccache -M 10G

          set -eo pipefail
          echo "Starting kernel build with -Wno-error (safe replacement)..."
          make O=out ARCH=arm64 -j$(nproc) Image.gz-dtb 2>&1 | tee build.log
          
          echo "=== CCACHE STATISTICS ==="
          ccache -s

      - name: Show errors if failed
        if: failure()
        run: |
          echo "======== BUILD FAILED - CHECK ERRORS ========"
          if [ -f build.log ]; then
            grep -n -B10 -A15 "error:" build.log | head -200 || echo "(khong co error:)"
            echo "======== 150 dong cuoi ========"
            tail -150 build.log || true
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin-ksunext-finasu
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: error
          retention-days: 30
