name: Build MT6768 Kernel (KernelSU-Next Legacy + FinaSU Manager)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: out/
          key: build-output-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            build-output-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache/
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev python3 python3-pip zip unzip git curl wget perl device-tree-compiler lz4 xz-utils zstd cpio rsync pahole kmod libc6-dev-i386 clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi g++-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi openssl ccache
          sudo ln -sf /usr/bin/clang-14 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/local/bin/llvm-strip

      - name: Prepare output dir
        run: mkdir -p out

      - name: Setup KernelSU-Next (Legacy Mode)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Apply Compatibility Patches
        run: |
          set +e
          # Fix blk-crypto
          [ -f include/linux/keyslot-manager.h ] && sed -i 's/__always_inline inline void ksm_flock/void ksm_flock/g; s/inline void ksm_flock/void ksm_flock/g; s/__always_inline void ksm_flock/void ksm_flock/g' include/linux/keyslot-manager.h
          [ -f include/linux/blk-crypto.h ] && sed -i 's/__always_inline inline void blk_crypto_flock/void blk_crypto_flock/g; s/inline void blk_crypto_flock/void blk_crypto_flock/g; s/__always_inline void blk_crypto_flock/void blk_crypto_flock/g' include/linux/blk-crypto.h
          # Fix file_wrapper.c
          FILE=$(find . -name "file_wrapper.c" -path "*/kernelsu/*" | head -1)
          if [ -n "$FILE" ] && [ -f "$FILE" ]; then
            perl -i -0777 -pe 's/(int ksu_wrapper_iopoll\s*\([^)]*\)\s*\{).*?(\n\})/$1\n    return -EOPNOTSUPP;\n$2/s' "$FILE"
            perl -i -0777 -pe 's/(loff_t ksu_wrapper_remap_file_range\s*\([^)]*\)\s*\{).*?(\n\})/$1\n    return -EOPNOTSUPP;\n$2/s' "$FILE"
            perl -i -pe 's/^(\s*)p->ops\.iopoll = .*/$1\/\/ p->ops.iopoll disabled/' "$FILE"
            perl -i -pe 's/^(\s*)p->ops\.remap_file_range = .*/$1\/\/ p->ops.remap_file_range disabled/' "$FILE"
          fi
          # Fix MODULE_IMPORT_NS
          grep -rl "MODULE_IMPORT_NS" --include="*.c" . 2>/dev/null | xargs -r sed -i '/MODULE_IMPORT_NS/d'
          # Fix seccomp_cache.c
          SC=$(find . -name "seccomp_cache.c" -path "*/kernelsu/*" | head -1)
          [ -n "$SC" ] && [ -f "$SC" ] && sed -i '1i #ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR 4096\n#endif' "$SC"

      - name: Backport path_umount for kernel 4.19
        run: |
          if ! grep -q "^int path_umount" fs/namespace.c 2>/dev/null; then
            echo "Adding path_umount backport..."
            # Dùng printf để đảm bảo tab được giữ nguyên
            {
              printf '\n/* Backported path_umount for kernel < 5.9 */\n'
              printf 'static int can_umount(const struct path *path, int flags)\n{\n'
              printf '\tstruct mount *mnt = real_mount(path->mnt);\n\n'
              printf '\tif (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))\n'
              printf '\t\treturn -EINVAL;\n'
              printf '\tif (!may_mount())\n'
              printf '\t\treturn -EPERM;\n'
              printf '\tif (path->dentry != path->mnt->mnt_root)\n'
              printf '\t\treturn -EINVAL;\n'
              printf '\tif (!check_mnt(mnt))\n'
              printf '\t\treturn -EINVAL;\n'
              printf '\tif (mnt->mnt.mnt_flags & MNT_LOCKED)\n'
              printf '\t\treturn -EINVAL;\n'
              printf '\tif (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))\n'
              printf '\t\treturn -EPERM;\n'
              printf '\treturn 0;\n}\n\n'
              printf 'int path_umount(struct path *path, int flags)\n{\n'
              printf '\tstruct mount *mnt = real_mount(path->mnt);\n'
              printf '\tint ret;\n\n'
              printf '\tret = can_umount(path, flags);\n'
              printf '\tif (!ret)\n'
              printf '\t\tret = do_umount(mnt, flags);\n\n'
              printf '\tdput(path->dentry);\n'
              printf '\tmntput_no_expire(mnt);\n'
              printf '\treturn ret;\n}\n'
              printf 'EXPORT_SYMBOL(path_umount);\n'
            } >> fs/namespace.c
            echo "path_umount added successfully"
          else
            echo "path_umount already exists"
          fi
          # Add declaration to fs/internal.h
          if [ -f fs/internal.h ] && ! grep -q "int path_umount" fs/internal.h; then
            echo "int path_umount(struct path *path, int flags);" >> fs/internal.h
            echo "Declaration added to fs/internal.h"
          fi

      - name: Extract FinaSU Manager Signature
        run: |
          DEFAULT_SIZE="0x033b"
          DEFAULT_HASH="c371061b19d8c7d7d6133c6a9bafe198fa944e50c1b31c9d8daa8d7f1fc2d2d6"
          if wget -q https://github.com/LyraVoid/FinaSU/releases/latest/download/FinaSU_Manager.apk -O manager.apk 2>/dev/null; then
            if unzip -q manager.apk META-INF/CERT.RSA 2>/dev/null && [ -f META-INF/CERT.RSA ]; then
              KSU_SIZE=$(stat -c%s META-INF/CERT.RSA)
              KSU_HASH=$(openssl dgst -sha256 META-INF/CERT.RSA | awk '{print $2}')
              echo "$KSU_SIZE" > /tmp/ksu_size
              echo "$KSU_HASH" > /tmp/ksu_hash
            else
              echo "$DEFAULT_SIZE" > /tmp/ksu_size
              echo "$DEFAULT_HASH" > /tmp/ksu_hash
            fi
          else
            echo "$DEFAULT_SIZE" > /tmp/ksu_size
            echo "$DEFAULT_HASH" > /tmp/ksu_hash
          fi

      - name: Configure Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LD=ld.lld
          make O=out ARCH=arm64 vendor/mt6768_defconfig
          KSU_SIZE=$(cat /tmp/ksu_size)
          KSU_HASH=$(cat /tmp/ksu_hash)
          KSU_SIZE_HEX=$(printf '%x' "$KSU_SIZE")
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_KPROBE_HOOKS=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
            echo "CONFIG_MODULES=y"
            echo "CONFIG_MODULE_FORCE_LOAD=y"
            echo "CONFIG_MODULE_FORCE_UNLOAD=y"
            echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y"
            echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES=\"mediatek/mt6768\""
            echo "CONFIG_KSU_EXPECTED_SIZE=0x${KSU_SIZE_HEX}"
            echo "CONFIG_KSU_EXPECTED_HASH=\"${KSU_HASH}\""
          } >> arch/arm64/configs/vendor/merlin.config
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m out/.config arch/arm64/configs/vendor/merlin.config
          make O=out ARCH=arm64 olddefconfig
          sed -i 's/CONFIG_BLK_INLINE_ENCRYPTION=y/CONFIG_BLK_INLINE_ENCRYPTION=n/g' out/.config
          sed -i 's/CONFIG_FS_ENCRYPTION=y/CONFIG_FS_ENCRYPTION=n/g' out/.config
          make O=out ARCH=arm64 olddefconfig
          grep -E "CONFIG_KSU=y|CONFIG_KSU_KPROBE_HOOKS=y" out/.config

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ccache -z
          ccache -M 10G
          set -eo pipefail
          make O=out ARCH=arm64 -j$(nproc) KCFLAGS="-w" HOSTCFLAGS="-w" Image.gz-dtb 2>&1 | tee build.log
          ccache -s

      - name: Show errors if failed
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -n -B10 -A15 "error:" build.log | head -200 || echo "(no error found)"
            echo "======== Last 150 lines ========"
            tail -150 build.log
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin-ksunext-finasu
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: error
          retention-days: 30
