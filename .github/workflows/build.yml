name: Build MT6768 Kernel for Merlin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            pahole kmod libc6-dev-i386 \
            software-properties-common

      # ------------------------------------------------------------------
      # Cai GCC 9 tu PPA Ubuntu (nhanh, on dinh hon AOSP clone)
      # ------------------------------------------------------------------
      - name: Install GCC 9 from PPA
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y \
            gcc-9-aarch64-linux-gnu g++-9-aarch64-linux-gnu \
            gcc-9-arm-linux-gnueabi g++-9-arm-linux-gnueabi

          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/local/bin/aarch64-linux-gnu-gcc
          sudo ln -sf /usr/bin/aarch64-linux-gnu-g++-9 /usr/local/bin/aarch64-linux-gnu-g++
          sudo ln -sf /usr/bin/arm-linux-gnueabi-gcc-9 /usr/local/bin/arm-linux-gnueabi-gcc
          sudo ln -sf /usr/bin/arm-linux-gnueabi-g++-9 /usr/local/bin/arm-linux-gnueabi-g++

          echo "=== Kiem tra ==="
          aarch64-linux-gnu-gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1

      - name: Prepare output dir
        run: mkdir -p out

      - name: Configure kernel (mt6768_defconfig + merlin.config)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=aarch64-linux-gnu-gcc-9

          echo "=== Compiler ==="
          which aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version | head -1

          make O=out ARCH=arm64 vendor/mt6768_defconfig

          echo "=== Merge merlin.config ==="
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m \
            out/.config \
            arch/arm64/configs/vendor/merlin.config

          make O=out ARCH=arm64 olddefconfig

          echo "=== KIEM TRA CONFIG ==="
          grep -E "CONFIG_BLK_INLINE_ENCRYPTION|CONFIG_ARCH_MEDIATEK|CONFIG_CC_OPTIMIZE" out/.config || true

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== Compiler dang dung ==="
          aarch64-linux-gnu-gcc --version | head -1

          set -o pipefail
          make O=out ARCH=arm64 -j$(nproc) \
            CC=aarch64-linux-gnu-gcc-9 \
            LD=aarch64-linux-gnu-ld \
            AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm \
            OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump \
            STRIP=aarch64-linux-gnu-strip \
            2>&1 | tee build.log | tail -300

      - name: Show errors if failed
        if: failure()
        run: |
          echo "======== error: DAU TIEN ========"
          grep -n -B10 -A15 "error:" build.log | head -200 || echo "(khong co error:)"
          echo ""
          echo "======== Error 1/2 ========"
          grep -n -B5 -A5 "Error [12]" build.log | head -100 || true
          echo ""
          echo "======== 150 dong cuoi ========"
          tail -150 build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: warn
          retention-days: 30