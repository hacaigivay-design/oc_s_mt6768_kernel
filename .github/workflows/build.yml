name: Build MT6768 Kernel for Merlin

on:
  workflow_dispatch:   # Cho phép bấm chạy tay từ tab Actions

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies & Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python3-pip zip unzip git curl wget \
            device-tree-compiler lz4 xz-utils zstd cpio rsync \
            clang gcc-aarch64-linux-gnu

      - name: Prepare output dir
        run: mkdir -p out

      - name: Configure kernel (Base defconfig + Merlin config)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          echo "Bước 1: Tạo base config..."
          make O=out ARCH=arm64 defconfig
          
          echo "Bước 2: Gộp cấu hình merlin.config..."
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out \
            out/.config \
            arch/arm64/configs/vendor/merlin.config

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          echo "Bắt đầu build kernel..."
          make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-merlin
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb.img
          if-no-files-found: warn
          retention-days: 30
